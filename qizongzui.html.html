<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>七宗罪 × 七美德｜55 题潜意识自测</title>
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@600;700;900&amp;family=Noto+Sans+SC:wght@400;500;700&amp;family=Cinzel:wght@600;700&amp;display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23201a33'/%3E%3Cpath d='M32 12c6 8 16 14 16 26a16 16 0 0 1-32 0c0-12 10-18 16-26z' fill='%23f0b8d0'/%3E%3Cpath d='M32 16c-4 5-10 9-10 17a10 10 0 0 0 20 0c0-8-6-12-10-17z' fill='%23201a33'/%3E%3Ccircle cx='47' cy='18' r='3' fill='%23c9a86a'/%3E%3C/svg%3E">
<style>
/* ===== 设计 token：暗黑哥特 × 可爱 ===== */
:root{
  --bg1:#171021; --bg2:#2a1b3a; --bg3:#3a2350;
  --ink:#f3e8f3; --muted:#cdbfd6; --soft:#a98fa8;
  --pink:#f0b8d0; --pinkDeep:#e08fb0; --lav:#b9a0e0; --lavDeep:#8f6fc0;
  --cream:#f6ecf0; --gold:#c9a86a; --red:#c96a7e; --teal:#9ad5d0;
  --card:rgba(44,30,64,.72); --card2:rgba(56,38,82,.62);
  --line:rgba(240,184,208,.28); --lineSoft:rgba(185,160,224,.22);
  --shadow:0 18px 50px rgba(10,4,18,.55);
  --r-lg:26px; --r-md:20px; --r-sm:14px;
  --ff-sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --ff-serif:"Noto Serif SC","Songti SC","SimSun",serif;
  --ff-cinzel:"Cinzel","Times New Roman",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--ff-sans);color:var(--ink);line-height:1.62;
  background:radial-gradient(120% 90% at 50% -8%,var(--bg3) 0%,var(--bg2) 46%,var(--bg1) 100%) fixed;
  min-height:100vh;overflow-x:hidden;
}
/* 暗星空背景 */
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(1.5px 1.5px at 12% 22%,rgba(240,184,208,.5),transparent 100%),
    radial-gradient(1.5px 1.5px at 68% 12%,rgba(201,168,106,.5),transparent 100%),
    radial-gradient(1.5px 1.5px at 84% 44%,rgba(185,160,224,.5),transparent 100%),
    radial-gradient(1.5px 1.5px at 28% 64%,rgba(240,184,208,.4),transparent 100%),
    radial-gradient(1.5px 1.5px at 52% 82%,rgba(201,168,106,.4),transparent 100%),
    radial-gradient(1.5px 1.5px at 92% 78%,rgba(185,160,224,.45),transparent 100%),
    radial-gradient(2px 2px at 8% 88%,rgba(240,184,208,.5),transparent 100%),
    radial-gradient(1.5px 1.5px at 42% 8%,rgba(201,168,106,.45),transparent 100%);
  opacity:.8;
}
#app{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:28px 18px 60px}
.view{display:none}
.view.active{display:block;animation:fadeUp .5s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* 哥特尖拱壳 */
.arch{
  position:relative;background:var(--card);border:1px solid var(--lineSoft);
  border-radius:var(--r-lg);padding:34px 26px;
  box-shadow:var(--shadow);backdrop-filter:blur(6px);
}
.arch::before{
  content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:118px;height:66px;background:rgba(240,184,208,.12);
  border-radius:118px 118px 0 0;border:1px solid var(--line);border-bottom:none;
  pointer-events:none;
}
.badge{
  display:inline-flex;align-items:center;gap:8px;
  padding:6px 16px;border-radius:999px;font-size:13px;letter-spacing:.08em;
  border:1px solid var(--line);color:var(--pink);background:rgba(240,184,208,.08);
}
.badge .dot{width:7px;height:7px;border-radius:50%;background:var(--pink);box-shadow:0 0 10px var(--pink)}

/* 封面 */
#view-home{text-align:center;padding-top:26px}
.hero-title{
  font-family:var(--ff-serif);font-weight:900;font-size:clamp(34px,9vw,56px);
  line-height:1.18;color:var(--ink);
  text-shadow:0 0 26px rgba(240,184,208,.4);
}
.hero-title .amp{color:var(--pink);font-family:var(--ff-cinzel);font-weight:700;padding:0 .1em}
.hero-sub{
  font-family:var(--ff-cinzel);letter-spacing:.22em;color:var(--gold);
  font-size:13px;margin-top:10px;text-transform:uppercase;
}
.decoRow{display:flex;justify-content:center;gap:14px;margin:20px 0;color:var(--lav);font-size:18px}
.decoRow svg{width:22px;height:22px;fill:currentColor}

.intro-card{text-align:left;margin-top:8px}
.intro-card p{font-size:15px;color:var(--muted);margin:12px 0}
.intro-card b{color:var(--pink)}
.hint-box{
  margin:18px 0 4px;padding:16px 18px;border-radius:var(--r-md);
  background:var(--card2);border:1px solid var(--lineSoft);
}
.hint-box .h-t{font-weight:700;color:var(--cream);font-size:15px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.hint-box .h-t svg{width:16px;height:16px;fill:var(--gold);flex:none}
.hint-box .row{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:14px;color:var(--muted)}
.hint-box .key{
  font-family:var(--ff-cinzel);color:var(--gold);font-weight:700;width:14px;text-align:center;flex:none;
}
.hint-box .pts{font-size:12px;color:var(--soft)}
.rule-box{margin-top:14px}
.rule-box .r-t{font-weight:700;color:var(--cream);font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.rule-box .r-t svg{width:16px;height:16px;fill:var(--pink);flex:none}
.rule-box .chip{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);padding:7px 0;border-bottom:1px dashed var(--lineSoft)}
.rule-box .chip:last-child{border-bottom:none}
.rule-box .chip b{color:var(--lav)}

.btn{
  display:block;width:100%;border:none;cursor:pointer;
  font-family:var(--ff-sans);font-weight:700;font-size:18px;
  padding:16px;border-radius:999px;color:#241531;
  background:linear-gradient(120deg,var(--pink),var(--lav));
  box-shadow:0 10px 30px rgba(240,184,208,.35);
  transition:transform .15s,box-shadow .15s;margin-top:26px;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 36px rgba(240,184,208,.5)}
.btn:active{transform:none}

/* 测试视图 */
.q-top{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.q-dim{
  font-size:13px;letter-spacing:.1em;color:var(--lav);font-weight:700;
  padding:5px 14px;border:1px solid var(--line);border-radius:999px;white-space:nowrap;
}
.q-count{font-size:13px;color:var(--soft);margin-left:auto;font-family:var(--ff-cinzel)}
.q-progress{height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin:14px 0 26px}
.q-progress i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--pink),var(--lav));transition:width .3s}
.q-stem{
  font-family:var(--ff-serif);font-weight:700;font-size:clamp(19px,4.6vw,24px);
  line-height:1.5;color:var(--cream);margin-bottom:26px;
}
.opt{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--lineSoft);border-radius:var(--r-md);
  padding:15px 16px;margin-bottom:12px;cursor:pointer;color:var(--muted);font-size:15px;
  transition:border-color .15s,background .15s,transform .1s;
}
.opt:hover{border-color:var(--pink);transform:translateX(3px)}
.opt.sel{border-color:var(--pink);background:rgba(240,184,208,.12);color:var(--cream)}
.opt .letter{
  flex:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:var(--ff-cinzel);font-weight:700;font-size:15px;color:var(--pink);
  border:1px solid var(--line);
}
.opt.sel .letter{background:linear-gradient(120deg,var(--pink),var(--lav));color:#241531;border-color:transparent}
.opt .txt{flex:1}
.opt .pick{font-size:12px;color:var(--gold);opacity:0}
.opt.sel .pick{opacity:1}
.q-nav{display:flex;gap:12px;margin-top:6px}
.q-nav .btn{flex:1;margin-top:0;font-size:15px;padding:13px}
.q-nav .btn.ghost{background:transparent;color:var(--pink);border:1px solid var(--line);box-shadow:none}
.q-nav .btn.ghost:hover{border-color:var(--pink)}
.q-nav .btn:disabled{opacity:.4;cursor:not-allowed;transform:none}

.note{font-size:12px;color:var(--soft);text-align:center;margin-top:22px}

/* ===== 结果视图 ===== */
.result-head{text-align:center;margin-bottom:20px}
.result-head h2{font-family:var(--ff-serif);font-weight:900;font-size:clamp(30px,8vw,46px);color:var(--ink);text-shadow:0 0 24px rgba(240,184,208,.35)}
.result-head p{font-size:13px;color:var(--muted);margin-top:6px}
.dominant{display:grid;grid-template-columns:1fr;gap:16px;margin-bottom:18px}
@media(min-width:640px){.dominant{grid-template-columns:1fr 1fr}}
.dom-card{position:relative;border-radius:var(--r-lg);padding:24px 20px;overflow:hidden;border:1px solid var(--lineSoft)}
.dom-card.sin{background:linear-gradient(150deg,rgba(150,70,100,.55),rgba(52,28,60,.7))}
.dom-card.vir{background:linear-gradient(150deg,rgba(70,100,140,.5),rgba(48,34,76,.7))}
.dom-card .d-tag{font-size:11px;letter-spacing:.16em;color:var(--lav);font-family:var(--ff-cinzel)}
.dom-card.sin .d-tag{color:var(--pink)}
.dom-card .d-name{font-family:var(--ff-serif);font-weight:900;font-size:30px;color:var(--cream);margin:6px 0 4px}
.dom-card .d-sub{font-size:14px;color:var(--muted);line-height:1.78}
.dom-card .d-score{position:absolute;right:18px;top:20px;font-family:var(--ff-cinzel);color:var(--gold);font-size:13px}
.dom-card .d-bar{height:6px;border-radius:999px;background:rgba(255,255,255,.12);margin-top:12px;overflow:hidden}
.dom-card .d-bar i{display:block;height:100%;border-radius:999px}
.chart-block{margin:4px 0 20px}
.chart-block .c-t{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--cream);font-size:15px;margin-bottom:12px}
.chart-block .c-t svg{width:16px;height:16px;fill:var(--gold);flex:none}
.chart-wrap{width:100%;height:260px}
@media(min-width:640px){.chart-wrap{height:300px}}
.analysis{margin-top:8px}
.analysis .a-card{background:var(--card2);border:1px solid var(--lineSoft);border-radius:var(--r-md);padding:20px;margin-bottom:16px}
.analysis .a-h{display:flex;align-items:center;gap:12px;font-family:var(--ff-serif);font-weight:900;font-size:21px;color:var(--cream);margin-bottom:14px}
.analysis .a-h .ico{width:40px;height:40px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;font-size:21px;color:#241531}
.analysis .seg{margin:12px 0}
.analysis .seg .s-t{font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--gold);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.analysis .seg .s-t::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold);flex:none}
.analysis .seg p{font-size:14.5px;color:var(--muted);line-height:1.78}
.analysis .seg p b{color:var(--pink)}
.seg-grid{display:grid;grid-template-columns:1fr;gap:4px 22px}
@media(min-width:640px){.seg-grid{grid-template-columns:1fr 1fr}}
.all-scores{margin-top:8px}
.all-scores .l-t{font-weight:700;color:var(--cream);font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.all-scores .l-t svg{width:16px;height:16px;fill:var(--lav);flex:none}
.all-scores .chip{display:flex;justify-content:space-between;align-items:center;padding:8px 2px;border-bottom:1px dashed var(--lineSoft);font-size:14px;color:var(--muted)}
.all-scores .chip:last-child{border-bottom:none}
.all-scores .chip .name{display:flex;align-items:center;gap:9px}
.all-scores .chip .sq{width:10px;height:10px;border-radius:3px;flex:none}
.all-scores .chip .num{font-family:var(--ff-cinzel);color:var(--gold)}
.all-scores .chip .tier{font-size:12px;color:var(--lav);letter-spacing:.02em}
.all-scores .profile-note{font-size:13.5px;color:var(--muted);line-height:1.7;margin:12px 0 16px;padding:13px 15px;background:rgba(185,160,224,.1);border:1px solid var(--lineSoft);border-radius:var(--r-sm)}
.all-scores .profile-note b{color:var(--pink)}
.restart-btn{background:transparent;color:var(--pink);border:1px solid var(--line);box-shadow:none}
.restart-btn:hover{border-color:var(--pink);box-shadow:0 8px 22px rgba(240,184,208,.2)}
.loading{text-align:center;padding:60px 0;color:var(--soft);font-size:14px}
</style>
</head>
<body>
<div id="app">

  <!-- ===== 视图：封面 ===== -->
  <section id="view-home" class="view active">
    <div class="arch" style="padding:40px 26px">
      <div class="badge"><span class="dot"></span>潜意识自测</div>
      <h1 class="hero-title" style="margin-top:18px">七宗罪<span class="amp">×</span>七美德</h1>
      <div class="hero-sub">56 Questions · Self Test</div>
      <div class="decoRow">
        <svg viewBox="0 0 24 24"><path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8z"/></svg>
        <svg viewBox="0 0 24 24"><path d="M12 21s-7-4.4-9.3-9C1 8 3 5 6 5c2 0 3 1 6 4 3-3 4-4 6-4 3 0 5 3 3.3 7-2.3 4.6-9.3 9-9.3 9z"/></svg>
        <svg viewBox="0 0 24 24"><path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8z"/></svg>
      </div>

      <div class="intro-card">
        <p><b>不是宗教审判！</b>每个人心底都同时藏着欲望与温柔，14 种特质占比各不相同。</p>
        <p>凭第一感觉选择，不要反复权衡，最后算出你的<b>主导原罪</b>&amp;<b>主导美德</b>。</p>
      </div>

      <div class="hint-box">
        <div class="h-t"><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 2.4 1.2 4.5 3 5.7V17h8v-2.3c1.8-1.2 3-3.3 3-5.7a7 7 0 0 0-7-7zM9 19h6v2H9z"/></svg>选项统一 · 凭第一感觉</div>
        <div class="row"><span class="key">A</span>非常符合</div>
        <div class="row"><span class="key">B</span>比较符合</div>
        <div class="row"><span class="key">C</span>中立</div>
        <div class="row"><span class="key">D</span>不太符合</div>
        <div class="row"><span class="key">E</span>完全不符合</div>
      </div>

      <div class="rule-box">
        <div class="r-t"><svg viewBox="0 0 24 24"><path d="M4 6l8 4 8-4-8-4zM4 10l8 4 8-4M4 14l8 4 8-4"/></svg>题量</div>
        <div class="chip"><span>共 56 题 · 7×7 原罪 + 7 美德</span><b>约 6 分钟</b></div>
      </div>

      <button class="btn" id="btnStart">开始测试</button>
    </div>
  </section>

  <!-- ===== 视图：测试 ===== -->
  <section id="view-quiz" class="view">
    <div class="arch">
      <div class="q-top">
        <span class="q-dim" id="qDim">傲慢</span>
        <span class="q-count" id="qCount">1 / 55</span>
      </div>
      <div class="q-progress"><i id="qProg" style="width:0%"></i></div>
      <div class="q-stem" id="qStem">题目内容</div>
      <div id="qOpts"></div>
      <div class="q-nav">
        <button class="btn ghost" id="btnPrev">上一题</button>
        <button class="btn" id="btnNext">下一题</button>
      </div>
      <div class="note" id="qNote">凭第一直觉作答，不要反复权衡</div>
    </div>
  </section>

  <!-- ===== 视图：结果（由 JS 填充） ===== -->
  <section id="view-result" class="view">
    <div id="resultMount"></div>
  </section>

</div>
<script src="https://fastly.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<script>
const DIMS = {
  pride:{name:'傲慢',type:'sin',color:'#c96a7e',icon:'傲'},
  envy:{name:'嫉妒',type:'sin',color:'#b9a0e0',icon:'嫉'},
  wrath:{name:'暴怒',type:'sin',color:'#e08f6a',icon:'怒'},
  sloth:{name:'懒惰',type:'sin',color:'#9ad5d0',icon:'懒'},
  greed:{name:'贪婪',type:'sin',color:'#c9a86a',icon:'贪'},
  gluttony:{name:'暴食',type:'sin',color:'#e0b0c0',icon:'饕'},
  lust:{name:'色欲',type:'sin',color:'#e08fb0',icon:'欲'},
  humility:{name:'谦卑',type:'virtue',color:'#a5c8f0',icon:'谦'},
  forgiveness:{name:'宽容',type:'virtue',color:'#9ad5d0',icon:'宽'},
  patience:{name:'耐心',type:'virtue',color:'#d9c5a0',icon:'耐'},
  diligence:{name:'勤勉',type:'virtue',color:'#e0d0a0',icon:'勤'},
  generosity:{name:'慷慨',type:'virtue',color:'#d0a0e0',icon:'慷'},
  temperance:{name:'节制',type:'virtue',color:'#9fd0b0',icon:'节'},
  chastity:{name:'贞洁',type:'virtue',color:'#c0a8e0',icon:'贞'}
};
const ORDER = ['pride','envy','wrath','sloth','greed','gluttony','lust','humility','forgiveness','patience','diligence','generosity','temperance','chastity'];
const QUESTIONS = [
  {dim:'pride',text:'我很难接受别人否定我的想法，下意识想反驳证明自己'},
  {dim:'pride',text:'我常常觉得自己的眼光、能力优于身边大部分人'},
  {dim:'pride',text:'被夸奖时内心会默认：我本来就值得这些赞美'},
  {dim:'pride',text:'犯错之后，比起认错，我更在意会不会损害我的形象'},
  {dim:'pride',text:'我不喜欢听从别人安排，本能反感被指挥'},
  {dim:'pride',text:'对比同龄人，我不甘心做一个普通、不起眼的人'},
  {dim:'pride',text:'别人请教我，我内心会有优越感'},
  {dim:'envy',text:'看到朋友拿到我梦寐以求的机会，心里会发酸'},
  {dim:'envy',text:'别人拥有我没有的东西，我会忍不住暗自对比'},
  {dim:'envy',text:'当熟人过得比我顺利，很难发自内心祝福对方'},
  {dim:'envy',text:'看到别人晒成绩、礼物、好运，容易觉得不公平'},
  {dim:'envy',text:'我会悄悄留意，不想身边人超过我'},
  {dim:'envy',text:'同样努力，别人收获更多时，我容易心生不甘'},
  {dim:'envy',text:'别人的闪光点，会让我隐隐有压力'},
  {dim:'wrath',text:'事情不顺心意，很容易瞬间上火、情绪上头'},
  {dim:'wrath',text:'被冒犯之后，我会记很久，想要讨回公道'},
  {dim:'wrath',text:'排队、被人敷衍、被打断，很容易激怒我'},
  {dim:'wrath',text:'争吵时，控制不住说出伤人的话'},
  {dim:'wrath',text:'生气的时候，只想立刻发泄，很难冷静'},
  {dim:'wrath',text:'别人反复犯同样的错，我会很不耐烦'},
  {dim:'wrath',text:'受委屈第一反应是反击，而不是释怀'},
  {dim:'sloth',text:'明明知道该做事，还是想拖延、摆烂'},
  {dim:'sloth',text:'没有外界催促，我很难主动推进长期计划'},
  {dim:'sloth',text:'很多想变好的目标，最后都不了了之'},
  {dim:'sloth',text:'能省事就省事，不愿意额外付出精力'},
  {dim:'sloth',text:'遇到难题，第一想法是逃避而不是解决'},
  {dim:'sloth',text:'经常精神倦怠，懒得维系关系、打理生活'},

<script>
(function(){
  'use strict';
  var LETTERS=['A','B','C','D','E'];
  var OPT_TEXT=['非常符合','比较符合','中立','不太符合','完全不符合'];
  var POINTS={A:5,B:4,C:3,D:2,E:1};
  var current=0;
  var answers=new Array(QUESTIONS.length).fill(null);

  function $(id){return document.getElementById(id);}
  function show(id){var v=document.querySelectorAll('.view');for(var i=0;i<v.length;i++)v[i].classList.remove('active');$(id).classList.add('active');}

  /* ---------- 测试视图 ---------- */
  function renderQuestion(){
    var q=QUESTIONS[current], dim=DIMS[q.dim];
    $('qDim').textContent=dim.name;
    $('qDim').style.color=dim.color;
    $('qCount').textContent=(current+1)+' / '+QUESTIONS.length;
    $('qProg').style.width=((current+1)/QUESTIONS.length*100)+'%';
    $('qStem').textContent=q.text;
    var opts=$('qOpts');opts.innerHTML='';
    for(var i=0;i<5;i++){
      var div=document.createElement('div');
      div.className='opt'+(answers[current]===LETTERS[i]?' sel':'');
      div.setAttribute('role','radio');div.setAttribute('aria-checked',answers[current]===LETTERS[i]);
      div.innerHTML='<span class="letter">'+LETTERS[i]+'</span><span class="txt">'+OPT_TEXT[i]+'</span><span class="pick">已选 ✓</span>';
      div.onclick=(function(idx){return function(){answers[current]=LETTERS[idx];renderQuestion();};})(i);
      opts.appendChild(div);
    }
    $('btnPrev').disabled=(current===0);
    var next=$('btnNext');
    if(current===QUESTIONS.length-1){next.textContent='查看结果';}else{next.textContent='下一题';}
    window.scrollTo(0,0);
  }
  function showQuiz(){show('view-quiz');renderQuestion();}

  /* ---------- 计分 ---------- */
  function compute(){
    var s={};ORDER.forEach(function(k){s[k]=0;});
    QUESTIONS.forEach(function(q,i){s[q.dim]+=POINTS[answers[i]]||0;});
    return s;
  }

  /* 结果统一为 10 分制：原罪满分 35，美德满分 5 */
  function to10(v,type){return type==='sin'?Math.round(v/35*10*10)/10:Math.round(v/5*10*10)/10;}
  function tierLabel(v,type){
    if(v>=8)return type==='sin'?'欲望强':'美德突出';
    if(v>=6)return type==='sin'?'欲望较明显':'美德良好';
    if(v>=4)return '程度适中';
    return type==='sin'?'倾向较弱':'有待培养';
  }

  /* ---------- 结果视图 ---------- */
  function pickDominant(scores,type){
    var cand=ORDER.filter(function(k){return DIMS[k].type===type;});
    var best=cand[0],bestVal=scores[best];
    for(var i=1;i<cand.length;i++){if(scores[cand[i]]>bestVal){best=cand[i];bestVal=scores[cand[i]];}}
    return {key:best,val:bestVal,pool:cand};
  }
  function pct(v,max,min){min=min||0;return Math.round((v-min)/(max-min)*100);}

  function makeBar(elId,cats,vals,colors){
    var el=$(elId);var chart=echarts.init(el);
    chart.setOption({
      grid:{left:110,right:30,top:10,bottom:10,containLabel:true},
      tooltip:{trigger:'axis',axisPointer:{type:'shadow'},confine:true,backgroundColor:'rgba(30,20,44,.94)',borderColor:'rgba(240,184,208,.3)',textStyle:{color:'#f3e8f3',fontSize:12}},
      xAxis:{type:'value',min:0,max:10,splitLine:{lineStyle:{color:'rgba(255,255,255,.08)'}},axisLabel:{color:'#a98fa8',fontFamily:'monospace'}},
      yAxis:{type:'category',data:cats,axisLine:{show:false},axisTick:{show:false},axisLabel:{color:'#f3e8f3',fontSize:13}},
      series:[{type:'bar',data:vals.map(function(v,i){return {value:v,itemStyle:{color:colors[i],borderRadius:[0,6,6,0]}};}),barWidth:16}]
    });
    return chart;
  }

  function renderResult(){
    show('view-result');
    var scores=compute();
    var sin=pickDominant(scores,'sin');
    var vir=pickDominant(scores,'virtue');
    var mount=$('resultMount');
    var sinD=DIMS[sin.key],virD=DIMS[vir.key];
    var sinA=ANALYSIS[sin.key],virA=ANALYSIS[vir.key];
    var sinMax=sin.pool.reduce(function(m,k){return Math.max(m,scores[k]);},0);
    var virMax=vir.pool.reduce(function(m,k){return Math.max(m,scores[k]);},0);
    var html='';
    html+='<div class="result-head"><div class="badge"><span class="dot"></span>测试结果</div><h2>你的灵魂剖面</h2><p>主导原罪 × 主导美德 · 已为你展开一线细节</p></div>';
    var sin10=to10(sin.val,'sin'), vir10=to10(vir.val,'virtue');
    html+='<div class="dominant">';
    html+='  <div class="dom-card sin"><span class="d-tag">DOMINANT SIN · 主导原罪</span><span class="d-score">'+sin10+' / 10</span><div class="d-name">'+sinD.name+'</div><div class="d-sub">'+sinA.lead+'</div><div class="d-bar"><i style="width:'+(sin10*10)+'%;background:linear-gradient(90deg,'+sinD.color+',#f0b8d0)"></i></div></div>';
    html+='  <div class="dom-card vir"><span class="d-tag">DOMINANT VIRTUE · 主导美德</span><span class="d-score">'+vir10+' / 10</span><div class="d-name">'+virD.name+'</div><div class="d-sub">'+virA.lead+'</div><div class="d-bar"><i style="width:'+(vir10*10)+'%;background:linear-gradient(90deg,'+virD.color+',#9ad5d0)"></i></div></div>';
    html+='</div>';

    // 原罪条
    var sins=sin.pool.slice();sins.sort(function(a,b){return scores[b]-scores[a];});
    html+='<div class="chart-block"><div class="c-t"><svg viewBox="0 0 24 24"><path d="M4 6l8 4 8-4-8-4zM4 10l8 4 8-4M4 14l8 4 8-4"/></svg>七原罪强度（分数越高，该项欲望越强）</div><div class="chart-wrap" id="chartSins"></div></div>';
    // 美德条
    var vrs=vir.pool.slice();vrs.sort(function(a,b){return scores[b]-scores[a];});
    html+='<div class="chart-block"><div class="c-t"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.4-9.3-9C1 8 3 5 6 5c2 0 3 1 6 4 3-3 4-4 6-4 3 0 5 3 3.3 7-2.3 4.6-9.3 9-9.3 9z"/></svg>七美德强度（分数越高，该项美德越强）</div><div class="chart-wrap" id="chartVirtues"></div></div>';

    // 一线分析
    html+='<div class="analysis">';
    html+='  <div class="a-card"><div class="a-h"><span class="ico" style="background:'+sinD.color+'">'+sinD.icon+'</span>你的主导原罪 · '+sinD.name+'</div>';
    html+='    <div class="seg"><div class="s-t">为什么会是你</div><p>'+sinA.why+'</p></div>';
    html+='    <div class="seg"><div class="s-t">它的暗面代价</div><p>'+sinA.dark+'</p></div>';
    html+='    <div class="seg"><div class="s-t">健康转化</div><p>'+sinA.trans+'</p></div></div>';
    html+='  <div class="a-card"><div class="a-h"><span class="ico" style="background:'+virD.color+'">'+virD.icon+'</span>你的主导美德 · '+virD.name+'</div>';
    html+='    <div class="seg"><div class="s-t">为什么会是你</div><p>'+virA.why+'</p></div>';
    html+='    <div class="seg"><div class="s-t">它的价值与提醒</div><p>'+virA.keep+'</p></div></div>';
    html+='</div>';

    // 全维度
    html+='<div class="all-scores arch" style="margin-top:8px;padding:22px 22px"><div class="l-t"><svg viewBox="0 0 24 24"><path d="M4 6l8 4 8-4-8-4zM4 10l8 4 8-4M4 14l8 4 8-4"/></svg>14 种特质完整剖析</div>';
    html+='<div class="profile-note">综合你的作答，最突出的是主导原罪「'+sinD.name+'」（'+tierLabel(sin10,'sin')+'）与主导美德「'+virD.name+'」（'+tierLabel(vir10,'virtue')+'）。欲望与温柔在你身上不是对立，而是同一种生命力的两面。</div>';
    ORDER.forEach(function(k){
      var d=DIMS[k], v=to10(scores[k],d.type), tier=tierLabel(v,d.type);
      html+='<div class="chip"><span class="name"><span class="sq" style="background:'+d.color+'"></span>'+d.name+'</span><span class="tier">'+tier+'</span><span class="num">'+v+'分</span></div>';
    });
    html+='</div>';
    html+='<div class="note" style="margin-top:16px">趣味潜意识测试 · 仅作自我觉察参考，不算人格定论</div>';
    html+='<button class="btn restart-btn" id="btnRestart">重新测试</button>';
    mount.innerHTML=html;
    $('btnRestart').onclick=function(){location.hash='#home';};
    makeBar('chartSins',sins.map(function(k){return DIMS[k].name;}),sins.map(function(k){return to10(scores[k],'sin');}),sins.map(function(k){return DIMS[k].color;}));
    makeBar('chartVirtues',vrs.map(function(k){return DIMS[k].name;}),vrs.map(function(k){return to10(scores[k],'virtue');}),vrs.map(function(k){return DIMS[k].color;}));
  }

  /* ---------- 路由 ---------- */
  function route(){
    var h=location.hash.replace('#','');
    if(h==='quiz'){showQuiz();}
    else if(h==='result'){
      var done=answers.every(function(a){return a!==null;});
      if(!done){var un=QUESTIONS.filter(function(q,i){return answers[i]===null;}).length;if(!confirm('还有 '+un+' 题未作答，仍要查看结果吗？')){location.hash='#quiz';return;}}
      renderResult();
    }
    else{show('view-home');window.scrollTo(0,0);}
  }
  window.addEventListener('hashchange',route);

  $('btnStart').onclick=function(){location.hash='#quiz';};
  $('btnPrev').onclick=function(){if(current>0){current--;renderQuestion();}};
  $('btnNext').onclick=function(){
    if(answers[current]===null){alert('请先选择当前题目的答案');return;}
    if(current<QUESTIONS.length-1){current++;renderQuestion();}
    else{location.hash='#result';}
  };
  if(!location.hash){location.hash='#home';}else{route();}
})();
</script>
</body>
</html>
